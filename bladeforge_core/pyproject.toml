[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bladeforge-core"
version = "2.0.0"
description = "Versioned BladeForge generation registries shared by the API, worker, and Blender renderer"
requires-python = ">=3.11,<3.14"
# Deliberately dependency-light: this package is imported by Blender's bundled
# Python, which cannot install arbitrary wheels. numpy ships with Blender.
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["bladeforge_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disabled because the repository lives on a Windows path where pytest cannot always
# create its cache directory.
addopts = "-p no:cacheprovider"
